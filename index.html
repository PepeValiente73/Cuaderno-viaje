<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cuaderno de viaje</title>

  <script src="https://accounts.google.com/gsi/client"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #333;
    }

    header {
      background: #3f6b5b;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      font-size: 16px;
    }

    .google-area {
      text-align: center;
      margin: 20px;
    }

    .google-status {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #3f6b5b;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .day {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .day h2 {
      margin-top: 0;
      color: #3f6b5b;
    }

    .day input[type="text"],
    .day textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .day textarea {
      min-height: 120px;
      resize: vertical;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .photo-box {
      border: 2px dashed #bbb;
      border-radius: 8px;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      background: #fafafa;
      position: relative;
    }

    .photo-box img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .photo-box label {
      padding: 15px;
      cursor: pointer;
      color: #666;
    }

    .photo-box input {
      display: none;
    }

    .cover {
      border: 3px solid #d69b28;
    }

    .cover-label {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: #777;
    }

    .uploading {
      font-size: 14px;
      color: #666;
      padding: 20px;
    }

    .empty {
      text-align: center;
      padding: 35px 20px;
      color: #777;
    }

    .delete-day {
      background: #a64b4b;
      font-size: 14px;
      margin-top: 15px;
    }

    .error-message {
      color: #a64b4b;
      font-size: 14px;
      padding: 10px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 650px) {

      .photos {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 26px;
      }

    }

  </style>

</head>

<body>

<header>

  <h1>📖 Cuaderno de viaje</h1>

  <p>Nuestros recuerdos, juntos</p>

</header>


<div class="google-area">

  <button onclick="loginGoogle()">
    🔐 Conectar con Google Drive
  </button>

  <div
    id="googleStatus"
    class="google-status"
  >
    Google Drive no conectado
  </div>

</div>


<main>

  <div class="toolbar">

    <button onclick="addDay()">
      ➕ Añadir día
    </button>

  </div>

  <div id="days"></div>

</main>


<footer>

  Cuaderno de viaje

</footer>


<script>


  /*
   * ============================================================
   * CONFIGURACIÓN GOOGLE
   * ============================================================
   */

  const CLIENT_ID =
    "1065800137306-3q8oj4n83i9k1nof8neg56q97ic5642i.apps.googleusercontent.com";

  const SCOPES =
    "https://www.googleapis.com/auth/drive.file";


  let accessToken = null;

  let driveFolderId = null;


  /*
   * ============================================================
   * DATOS DEL CUADERNO
   * ============================================================
   */

  let days =
    JSON.parse(
      localStorage.getItem("travelDays")
    ) || [];


  /*
   * ============================================================
   * GUARDAR DATOS
   * ============================================================
   */

  function saveDays() {

    localStorage.setItem(
      "travelDays",
      JSON.stringify(days)
    );

  }


  /*
   * ============================================================
   * GOOGLE OAUTH
   * ============================================================
   */

  function loginGoogle() {

    const client =
      google.accounts.oauth2.initTokenClient({

        client_id:
          CLIENT_ID,

        scope:
          SCOPES,

        callback:
          async (response) => {

            if (response.error) {

              console.error(
                "Error OAuth:",
                response
              );

              alert(
                "No se ha podido conectar con Google Drive."
              );

              return;

            }


            accessToken =
              response.access_token;


            document.getElementById(
              "googleStatus"
            ).textContent =
              "Google Drive conectado. Comprobando carpeta...";


            await findOrCreateDriveFolder();

          }

      });


    client.requestAccessToken();

  }


  /*
   * ============================================================
   * BUSCAR CARPETA
   * ============================================================
   */

  async function findOrCreateDriveFolder() {

    try {

      const searchUrl =
        "https://www.googleapis.com/drive/v3/files" +
        "?q=" +
        encodeURIComponent(
          "name = 'Cuaderno de viaje' " +
          "and mimeType = 'application/vnd.google-apps.folder' " +
          "and trashed = false"
        ) +
        "&spaces=drive" +
        "&fields=files(id,name)";


      const response =
        await fetch(
          searchUrl,
          {

            method:
              "GET",

            headers: {

              "Authorization":
                "Bearer " +
                accessToken

            }

          }
        );


      const data =
        await response.json();


      console.log(
        "Carpetas encontradas:",
        data
      );


      if (
        data.files &&
        data.files.length > 0
      ) {

        driveFolderId =
          data.files[0].id;


        localStorage.setItem(
          "driveFolderId",
          driveFolderId
        );


        document.getElementById(
          "googleStatus"
        ).textContent =
          "Google Drive conectado ✓";


        return;

      }


      await createDriveFolder();

    }

    catch (error) {

      console.error(
        "Error buscando carpeta:",
        error
      );


      alert(
        "No se ha podido comprobar la carpeta de Google Drive."
      );

    }

  }


  /*
   * ============================================================
   * CREAR CARPETA
   * ============================================================
   */

  async function createDriveFolder() {

    try {

      const response =
        await fetch(
          "https://www.googleapis.com/drive/v3/files",
          {

            method:
              "POST",

            headers: {

              "Authorization":
                "Bearer " +
                accessToken,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                name:
                  "Cuaderno de viaje",

                mimeType:
                  "application/vnd.google-apps.folder"

              })

          }
        );


      const data =
        await response.json();


      if (
        data.id
      ) {

        driveFolderId =
          data.id;


        localStorage.setItem(
          "driveFolderId",
          driveFolderId
        );


        document.getElementById(
          "googleStatus"
        ).textContent =
          "Google Drive conectado ✓";


        alert(
          "Se ha creado la carpeta 'Cuaderno de viaje' en Google Drive."
        );

      }

      else {

        console.error(
          "Error creando carpeta:",
          data
        );


        alert(
          "No se ha podido crear la carpeta en Google Drive."
        );

      }

    }

    catch (error) {

      console.error(
        "Error:",
        error
      );


      alert(
        "Error al crear la carpeta de Google Drive."
      );

    }

  }


  /*
   * ============================================================
   * SUBIR FOTO A GOOGLE DRIVE
   * ============================================================
   */

  async function uploadPhotoToDrive(
    file,
    dayNumber,
    photoNumber
  ) {

    if (
      !accessToken
    ) {

      alert(
        "Primero debes conectar Google Drive."
      );

      return null;

    }


    if (
      !driveFolderId
    ) {

      alert(
        "No se ha encontrado la carpeta de Google Drive."
      );

      return null;

    }


    try {

      const safeName =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const fileName =
        "Dia_" +
        dayNumber +
        "_Foto_" +
        photoNumber +
        "_" +
        Date.now() +
        "_" +
        safeName;


      const metadata = {

        name:
          fileName,

        parents: [
          driveFolderId
        ]

      };


      const form =
        new FormData();


      form.append(
        "metadata",
        new Blob(
          [
            JSON.stringify(
              metadata
            )
          ],
          {
            type:
              "application/json"
          }
        )
      );


      form.append(
        "file",
        file
      );


      const response =
        await fetch(

          "https://www.googleapis.com/upload/drive/v3/files" +
          "?uploadType=multipart" +
          "&fields=id,name",

          {

            method:
              "POST",

            headers: {

              "Authorization":
                "Bearer " +
                accessToken

            },

            body:
              form

          }

        );


      const data =
        await response.json();


      console.log(
        "Foto subida:",
        data
      );


      if (
        data.id
      ) {

        return data.id;

      }


      console.error(
        "Google no devolvió ID:",
        data
      );


      return null;

    }

    catch (error) {

      console.error(
        "Error subiendo foto:",
        error
      );


      return null;

    }

  }


  /*
   * ============================================================
   * OBTENER URL DE UNA FOTO DE DRIVE
   * ============================================================
   */

  function getDriveImageUrl(
    fileId
  ) {

    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(
        fileId
      ) +
      "&sz=w1000"
    );

  }


  /*
   * ============================================================
   * AÑADIR DÍA
   * ============================================================
   */

  function addDay() {

    const dayNumber =
      days.length + 1;


    days.push({

      number:
        dayNumber,

      title:
        "",

      text:
        "",

      photos: [
        null,
        null,
        null
      ],

      cover:
        0

    });


    saveDays();

    render();

  }


  /*
   * ============================================================
   * ELIMINAR DÍA
   * ============================================================
   */

  function deleteDay(
    index
  ) {

    if (
      !confirm(
        "¿Seguro que quieres eliminar este día?"
      )
    ) {

      return;

    }


    days.splice(
      index,
      1
    );


    days.forEach(
      (day, i) => {

        day.number =
          i + 1;

      }
    );


    saveDays();

    render();

  }


  /*
   * ============================================================
   * TÍTULO
   * ============================================================
   */

  function updateTitle(
    index,
    value
  ) {

    days[index].title =
      value;

    saveDays();

  }


  /*
   * ============================================================
   * TEXTO
   * ============================================================
   */

  function updateText(
    index,
    value
  ) {

    days[index].text =
      value;

    saveDays();

  }


  /*
   * ============================================================
   * CAMBIAR FOTO
   * ============================================================
   */

  async function changePhoto(
    dayIndex,
    photoIndex,
    input
  ) {

    const file =
      input.files[0];


    if (!file) {

      return;

    }


    if (!accessToken) {

      alert(
        "Primero pulsa 'Conectar con Google Drive'."
      );

      input.value =
        "";

      return;

    }


    if (!driveFolderId) {

      alert(
        "No se ha encontrado la carpeta de Google Drive."
      );

      input.value =
        "";

      return;

    }


    const box =
      input.closest(
        ".photo-box"
      );


    if (box) {

      box.innerHTML =
        '<div class="uploading">☁️ Subiendo foto...</div>';

    }


    const fileId =
      await uploadPhotoToDrive(
        file,
        days[dayIndex].number,
        photoIndex + 1
      );


    if (!fileId) {

      alert(
        "No se ha podido subir la foto a Google Drive."
      );

      render();

      return;

    }


    /*
     * Guardamos SOLO el ID de Drive.
     *
     * Ya no guardamos la imagen completa
     * en localStorage.
     */

    days[
      dayIndex
    ].photos[
      photoIndex
    ] = {

      id:
        fileId,

      name:
        file.name

    };


    saveDays();

    render();

  }


  /*
   * ============================================================
   * FOTO DE PORTADA
   * ============================================================
   */

  function setCover(
    dayIndex,
    photoIndex
  ) {

    if (
      !days[
        dayIndex
      ].photos[
        photoIndex
      ]
    ) {

      return;

    }


    days[
      dayIndex
    ].cover =
      photoIndex;


    saveDays();

    render();

  }


  /*
   * ============================================================
   * DIBUJAR CUADERNO
   * ============================================================
   */

  function render() {

    const container =
      document.getElementById(
        "days"
      );


    container.innerHTML =
      "";


    if (
      days.length === 0
    ) {

      container.innerHTML = `

        <div class="empty">

          <h2>
            Tu cuaderno está vacío
          </h2>

          <p>
            Pulsa "Añadir día" para empezar vuestro viaje.
          </p>

        </div>

      `;

      return;

    }


    days.forEach(
      (
        day,
        dayIndex
      ) => {


        const article =
          document.createElement(
            "article"
          );


        article.className =
          "day";


        let photosHTML =
          "";


        for (
          let i = 0;
          i < 3;
          i++
        ) {


          const photo =
            day.photos[i];


          /*
           * Foto nueva guardada en Drive
           */

          if (
            photo &&
            typeof photo === "object" &&
            photo.id
          ) {


            const imageUrl =
              getDriveImageUrl(
                photo.id
              );


            photosHTML += `

              <div>

                <div
                  class="photo-box ${
                    day.cover === i
                      ? "cover"
                      : ""
                  }"
                >

                  <img
                    src="${imageUrl}"
                    alt="Foto del día ${
                      day.number
                    }"
                  >

                </div>


                <label
                  class="cover-label"
                >

                  <input
                    type="radio"
                    name="cover-${dayIndex}"
                    ${
                      day.cover === i
                        ? "checked"
                        : ""
                    }
                    onchange="setCover(
                      ${dayIndex},
                      ${i}
                    )"
                  >

                  ⭐ Foto de portada

                </label>

              </div>

            `;

          }


          /*
           * Fotos antiguas que estaban
           * guardadas como Data URL.
           *
           * Las seguimos mostrando para
           * no perderlas visualmente.
           */

          else if (
            typeof photo === "string" &&
            photo.startsWith(
              "data:image"
            )
          ) {


            photosHTML += `

              <div>

                <div
                  class="photo-box ${
                    day.cover === i
                      ? "cover"
                      : ""
                  }"
                >

                  <img
                    src="${photo}"
                    alt="Foto del día ${
                      day.number
                    }"
                  >

                </div>


                <label
                  class="cover-label"
                >

                  <input
                    type="radio"
                    name="cover-${dayIndex}"
                    ${
                      day.cover === i
                        ? "checked"
                        : ""
                    }
                    onchange="setCover(
                      ${dayIndex},
                      ${i}
                    )"
                  >

                  ⭐ Foto de portada

                </label>

              </div>

            `;

          }


          /*
           * Hueco para nueva foto
           */

          else {


            photosHTML += `

              <div>

                <div
                  class="photo-box"
                >

                  <label>

                    📷<br>

                    Añadir foto

                    <input
                      type="file"
                      accept="image/*"
                      onchange="changePhoto(
                        ${dayIndex},
                        ${i},
                        this
                      )"
                    >

                  </label>

                </div>

              </div>

            `;

          }

        }


        article.innerHTML = `

          <h2>
            Día ${day.number}
          </h2>


          <input
            type="text"
            placeholder="Título del día..."
            value="${
              escapeHTML(
                day.title
              )
            }"
            onchange="updateTitle(
              ${dayIndex},
              this.value
            )"
          >


          <textarea
            placeholder="Escribe aquí lo que hemos hecho, lo que hemos visto, alguna anécdota..."
            onchange="updateText(
              ${dayIndex},
              this.value
            )"
          >${
            escapeHTML(
              day.text
            )
          }</textarea>


          <h3>
            📸 Fotos
          </h3>


          <div class="photos">

            ${photosHTML}

          </div>


          <button
            class="delete-day"
            onclick="deleteDay(
              ${dayIndex}
            )"
          >

            🗑️ Eliminar día

          </button>

        `;


        container.appendChild(
          article
        );

      }
    );

  }


  /*
   * ============================================================
   * ESCAPAR HTML
   * ============================================================
   */

  function escapeHTML(
    text
  ) {

    return String(
      text || ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      );

  }


  /*
   * ============================================================
   * INICIAR
   * ============================================================
   */

  render();


</script>

</body>

</html>
